name: Run Data Sync

on:
  schedule:
    # GitHub cron uses UTC; 16:00 UTC is 00:00 the next day in Asia/Shanghai.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: Force a full Notion resync
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - .github/workflows/run_data_sync.yml
      - run_page/notion_sync.py
      - run_page/config.py
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: notion-workouts-sync
  cancel-in-progress: false

env:
  GITHUB_NAME: malinkang
  GITHUB_EMAIL: linkang.ma@gmail.com
  WORKOUTS_PAGE_TIMEZONE: ${{ secrets.WORKOUTS_PAGE_TIMEZONE || 'Asia/Shanghai' }}
  NOTION_SYNC_OVERLAP_SECONDS: ${{ secrets.NOTION_SYNC_OVERLAP_SECONDS || '300' }}

jobs:
  sync:
    name: Sync Notion Workouts
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      WORKOUT_DATABASE_ID: ${{ secrets.WORKOUT_DATABASE_ID || secrets.NOTION_DATABASE_ID }}
      TYPE_DATABASE_ID: ''
      SPLIT_DATABASE_ID: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync workouts from Notion
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_sync }}" = "true" ]; then
            python run_page/notion_sync.py --full-sync
          else
            python run_page/notion_sync.py
          fi

      - name: Commit synced activities
        run: |
          if git diff --quiet -- src/static/activities.json src/static/sleep_records.json; then
            echo "workout and sleep data unchanged"
            exit 0
          fi

          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add src/static/activities.json src/static/sleep_records.json
          git commit -m "Sync workouts and sleep data from Notion"
          git push origin HEAD:master
